# XRShell — Version je App (Gradle-Flavor). Gelesen von android/build.gradle, ungültige Werte
# brechen den Build ab. Schema MAJOR.MINOR.PATCH[-preview.N] (Skill xr-port-qa).
#
# Regeln:
#   - versionCode steigt für JEDE weitergegebene/installierte APK (nie zurück, nie doppelt).
#   - versionName ändert sich mit dem Funktionsumfang; der Build hängt „+<Commit>“ an
#     (dumpsys package zeigt so den genauen Stand), die Menü-Kopfzeile zeigt nur die Nummer.
#   - Änderungen in CHANGELOG.md unter „Unveröffentlicht“, beim Weitergeben eigener Abschnitt.
#
# <flavor>.versionName / <flavor>.versionCode     (Flavor → App-ID)

shell.versionName=0.1.1
shell.versionCode=2

