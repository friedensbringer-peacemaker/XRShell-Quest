# Doom / Doom II / Final Doom (DOS 1.9) - als DOS.YML in den Spielordner (Laufwerk C:) legen
# (tools/prepare-dos-games.ps1 macht das). DOSBox Pure liest C:\DOS.YML beim Start und nimmt
# die input_pad_*-Zeilen als Gamepad-Belegung von Port 0 ("Content Provided Mapping"); sie
# ersetzt die eingebaute Keyb2Joypad-Belegung (die kennt Doom II, TNT und Plutonia nicht
# und legt Esc auf RetroPad x).
# Gilt nur im Pad-Modus (xrshell.opt: xrshell_input = pad). Eine im DOSBox-Pure-Menue
# geaenderte Belegung (C:\PADMAP.DBP) hat Vorrang - zum Zuruecksetzen dort loeschen.
#
# RetroPad-Namen (libretro) -> Quest-Controller in XRShell (xrshell_input = pad,
# padmap::kDosPad in src/pad_mapping.cpp):
#   r = Trigger rechts   l2 = Griff rechts   y = A   b = B   x = X   start = Y
#   l = Trigger links    r3 = rechten Stick druecken
#   l3 = linken Stick druecken: bleibt frei = DOSBox-Pure-Menue/Bildschirmtastatur
#   Steuerkreuz (up/down/left/right) sendet XRShell im Pad-Modus nicht - nicht belegen.
# Tasten passen zur DEFAULT.CFG, die das Skript schreibt (Doom-Standardbelegung, Maus aus).
# Format: Taste[+Taste] Anzeigename (ASCII). Unbelegt bleiben das Steuerkreuz und R-Stick hoch/runter.

input_pad_lstick_up: up Vorwaerts
input_pad_lstick_down: down Rueckwaerts
input_pad_lstick_left: comma Seitwaerts links
input_pad_lstick_right: period Seitwaerts rechts
input_pad_rstick_left: left Drehen links
input_pad_rstick_right: right Drehen rechts
input_pad_r: leftctrl Feuern
input_pad_l2: leftshift Rennen
input_pad_y: space+enter Benutzen / Menue OK
input_pad_b: wheel Waffenrad
input_pad_x: tab Karte
input_pad_start: esc Menue
input_pad_l: y Ja (Abfragen)
input_pad_r3: f6 Schnellspeichern

# Waffenrad (B halten, mit einem Stick waehlen, loslassen)
input_wheel_1: 1 Faust / Kettensaege
input_wheel_2: 2 Pistole
input_wheel_3: 3 Schrotflinte
input_wheel_4: 4 Maschinengewehr
input_wheel_5: 5 Raketenwerfer
input_wheel_6: 6 Plasmagewehr
input_wheel_7: 7 BFG 9000
input_wheel_8: f9 Schnellladen
