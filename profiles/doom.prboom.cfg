# PrBoom-Grundeinstellung fuer xr.shooter - prepare-shooter.ps1 legt sie als <IWAD>.prboom.cfg
# (z. B. DOOM2.prboom.cfg) neben die WAD. PrBoom-libretro laedt sie als -baseconfig; die eigene
# prboom.cfg im Spielstand-Ordner (saves/<IWAD>/) hat danach Vorrang, d. h. die Werte gelten beim
# ersten Start und bleiben, bis sie im Doom-Menue geaendert werden.

# Bildrate 72 statt 60 (Index: 0=35 1=40 2=50 3=60 4=70 5=72): XRShell taktet den Core mit
# seiner Bildrate, die Quest zeigt 72 Hz -> ein Spielbild pro Display-Bild, kein Ruckeln.
uncapped_framerate        5

# Ja/Nein-Abfragen (Beenden, Nightmare, Schnellspeichern ueberschreiben) nehmen nur y/n/Leer/Esc.
# Im Gamepad-Modus schicken A, Trigger und L3 im Menue key_menu_enter -> auf 'y' gelegt, damit
# sie dort "Ja" sind; Start (Esc) bleibt "Nein". Menues vergleichen gegen key_menu_enter, laufen
# also weiter. key_fire ebenfalls 'y': im Spiel feuert R2 damit wie bisher, und beim Benennen
# eines Spielstands bestaetigt die Eingabe (key_fire) statt ein "Y" zu tippen. Die Tastatur
# liest PrBoom im Gamepad-Modus nicht - 'y' hat sonst keine Belegung.
key_menu_enter            0x79
key_fire                  0x79
